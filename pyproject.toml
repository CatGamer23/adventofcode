[project]
name = "adventofcode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "certifi==2026.7.22",
  "charset-normalizer==3.5.1",
  "idna==3.19",
  "markdown-it-py==4.2.0",
  "numpy==2.5.2",
  "pygments==2.21.0",
  "python-dotenv==1.2.3",
  "requests==2.34.2",
  "rich==15.0.0",
  "urllib3==2.7.0",
]

[tool.ruff]
indent-width = 2

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
ignore = [
  "E741", # ambiguous variable name
]
